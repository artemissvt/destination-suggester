spring.application.name=destination-suggester
spring.docker.compose.enabled=false

# Database — values injected via environment variables
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:destinationdb}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Password1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5