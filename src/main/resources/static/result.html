<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Results</title>
    <link rel="stylesheet" href="/css/styling.css">
</head>
<body>

<div class="full-page">

    <h1>Your Suggested Destinations ✈️</h1>

    <!-- Loading state -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        Generating your dream destinations...
    </div>

    <!-- Results will appear here -->
    <div id="results" class="results-container" style="display: none;"></div>

    <!-- Back button -->
    <button onclick="window.location.href='/home.html'">
        Try Another Search
    </button>

</div>

<script>
    function checkSession() {
        return fetch("/check-session", {
            credentials: "include"
        })
            .then(res => res.json())
            .then(data => {
                if (!data || data.status !== "LOGGED_IN") {
                    window.location.href = "/login.html";
                    throw new Error("Not logged in");
                }
            });
    }

    function loadResults() {
        fetch("/get-result", {
            credentials: "include"
        })
            .then(res => res.json())
            .then(data => {

                const container = document.getElementById("results");
                const loading = document.getElementById("loading");

                loading.style.display = "none";
                container.style.display = "block";

                if (!data.recommendations || data.recommendations.length === 0) {
                    container.innerHTML = "<p>No results found.</p>";
                    return;
                }

                let html = "<h2>Recommended for you</h2>";

                data.recommendations.forEach(item => {
                    html += `
                <div class="result-card">
                    <strong>${item.Destination}</strong>
                    <span>${item.Country}</span>
                </div>
            `;
                });

                container.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                window.location.href = "/home.html";
            });
    }

    // Run flow
    checkSession().then(loadResults);
</script>

</body>
</html>
